<body>
<div id="app"></div>
<style>
  #app, #app * { box-sizing: border-box; }
  #app {
    --mint: #47D7AC; --mint-ink: #0d6a4d; --apricot: #FDAA63; --purple: #7566A0;
    --sky: #99D6EA; --gold: #FFD637; --pale: #F1EB9C; --indigo: #8C93D8;
    --leaf: #8BC48A; --coral: #F2937D; --violet: #B295D1; --slate: #6C7A89; --xpa: #47D7AC;
    --red: #e56659; --red-10: #fdeceb;

    --safety: var(--mint); --qc: var(--purple); --brew: var(--sky); --packaging: var(--apricot);
    --maintenance: var(--gold); --logistics: var(--indigo); --engineering: var(--leaf);
    --customer: var(--coral); --planning: var(--violet); --people: var(--slate); --wins: var(--pale);

    --ink: #14161a; --ink-soft: #55585F; --muted: #9a9da3; --paper: #FBFBF9; --canvas: #ffffff;
    --line: rgba(0,0,0,.10); --line-soft: rgba(0,0,0,.06);
    --radius-sm: 8px; --radius-md: 12px; --radius-lg: 18px;
    --shadow-card: 0 1px 2px rgba(20,22,26,.04), 0 8px 24px -12px rgba(20,22,26,.10);
    --shadow-pop: 0 12px 32px -8px rgba(20,22,26,.22);
    --font-display: 'Space Grotesk', ui-sans-serif, sans-serif;
    --font-body: 'Inter', ui-sans-serif, sans-serif;
    --font-data: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;

    font-family: var(--font-body);
    color: var(--ink); background: var(--canvas); padding: 18px; max-width: 1400px; margin: 0 auto;
    -webkit-font-smoothing: antialiased;
  }
  .frame { background: transparent; padding: 0; }
  .topbar {
    display: flex; align-items: center; gap: 16px;
    margin-bottom: 18px; background: var(--canvas); border: 1px solid var(--line-soft);
    border-radius: var(--radius-lg); padding: 12px 16px; box-shadow: var(--shadow-card);
  }
  .date-pill { justify-self: center; display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; font-family: var(--font-display); }
  .date-pill .ico { width: 34px; height: 34px; border-radius: 10px; background: #fff; color: var(--ink); display: flex; align-items: center; justify-content: center; font-size: 15px; border: 1.5px solid var(--line); cursor: pointer; font-family: inherit; padding: 0; flex: 0 0 auto; transform: rotate(-3deg); }
  .date-pill .ico:hover { background: #F7F7F7; }
  .refresh-icon-btn { border: 1.5px solid var(--line); background: #fff; padding: 0; cursor: pointer; width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
  .refresh-icon-btn img { width: 20px; height: 20px; display: block; }
  .refresh-icon-btn:disabled { opacity: .5; cursor: default; }
  .refresh-icon-btn:hover:not(:disabled) { background: #F7F7F7; }
  .brand { display: flex; align-items: center; gap: 10px; justify-self: start; }
  .brand__mark { width: 34px; height: 34px; flex-shrink: 0; }
  .brand__logo { width: 34px; height: 34px; }
  .brand__text { display: flex; flex-direction: column; line-height: 1.15; }
  .brand__title { font-family: var(--font-display); font-weight: 700; font-size: 17px; color: var(--ink); white-space: nowrap; }
  .brand__sub { display: block; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-soft); font-family: var(--font-body); margin-top: 2px; }
  .lti-pill { justify-self: end; display: flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 14px; background: var(--paper); }
  .weekly-btn { justify-self: center; text-decoration: none; white-space: nowrap; padding: 9px 13px; font-size: 12.5px; }
  .topbar-nav { flex: 1; display: flex; align-items: center; justify-content: space-evenly; gap: 6px; flex-wrap: wrap; }
  .topbar-right { display: flex; align-items: center; gap: 10px; justify-self: end; }
  .gmail-icon-btn { width: 34px; height: 34px; border-radius: 10px; background: transparent; border: 1.5px solid var(--line); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; flex: 0 0 auto; transition: background .12s ease, border-color .12s ease; }
  .gmail-icon-btn:hover { background: rgba(0,0,0,.04); border-color: var(--ink); }
  .lti-pill .num { font-size: 20px; font-weight: 700; color: var(--ink); font-family: var(--font-data); }
  .lti-pill .lbl { font-size: 11px; font-weight: 700; color: var(--ink-soft); letter-spacing: .04em; text-transform: uppercase; }

  .section-label { font-weight: 700; font-size: 12px; letter-spacing: .06em; color: var(--ink-soft); margin: 22px 2px 10px; text-transform: uppercase; font-family: var(--font-body); }

  .kpi-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .card {
    border-radius: var(--radius-lg); overflow: hidden; background: var(--canvas);
    border: 1px solid var(--line-soft); box-shadow: var(--shadow-card);
    border-left: 4px solid var(--card-accent, var(--mint));
    display: flex; flex-direction: column;
  }
  .card-head { color: var(--ink); font-weight: 700; font-size: 12.5px; padding: 12px 14px 10px; display: flex; align-items: center; gap: 9px; font-family: var(--font-display); }
  .card-head .tabicon { flex-shrink: 0; width: 26px; height: 26px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 13px; transform: rotate(-3deg); background: var(--card-accent, var(--mint)); }
  .card-head .owner { font-weight: 600; opacity: .8; font-size: 10.5px; margin-left: auto; white-space: nowrap; font-family: var(--font-body); text-transform: uppercase; letter-spacing: .03em; color: var(--ink-soft); }
  .kpi-rows { padding: 2px 14px 12px; }
  .kpi-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 6px 0; border-bottom: 1px solid var(--line-soft); font-size: 12.5px; }
  .kpi-row:last-child { border-bottom: none; }
  .kpi-row .lbl { color: var(--ink-soft); }
  .kpi-row .val { font-weight: 700; color: var(--ink); font-family: var(--font-data); }

  .owner-grid { display: grid; gap: 12px; margin-bottom: 4px; }
  .owner-grid.g3 { grid-template-columns: repeat(3, 1fr); }
  .owner-grid.g4 { grid-template-columns: repeat(4, 1fr); }
  .bullets { padding: 4px 14px 14px; display: flex; flex-direction: column; gap: 9px; flex: 1; }
  .bullet { display: flex; gap: 8px; align-items: flex-start; }
  .bullet .rag { width: 9px; height: 9px; border-radius: 50%; margin-top: 5px; flex: 0 0 auto; background: var(--line); }
  .bullet .rag.green { background: var(--mint-ink); }
  .bullet .rag.amber { background: #b8860b; }
  .bullet .rag.red { background: var(--red); }
  .bullet .btext { font-size: 12.5px; line-height: 1.4; }
  .bullet .blabel { font-weight: 700; color: var(--ink); }
  .bullet .bval { color: var(--ink-soft); }
  .bullet .bval.empty { color: var(--muted); font-style: italic; }

  .wins-card { border-radius: var(--radius-lg); overflow: hidden; background: var(--canvas); border: 1px solid var(--line-soft); border-left: 4px solid var(--pale); box-shadow: var(--shadow-card); margin-top: 4px; }
  .prod-card { display: flex; gap: 28px; align-items: center; background: var(--canvas); border: 1px solid var(--line-soft); border-left: 4px solid var(--sky); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: 16px 26px; margin-bottom: 14px; }
  .prod-tank { flex: 0 0 auto; width: 190px; }
  .prod-tank svg { width: 100%; height: auto; display: block; }
  .prod-info { flex: 1; min-width: 0; }
  .prod-kicker { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
  .prod-pct { font-family: var(--font-display); font-weight: 700; font-size: 56px; line-height: 1.05; color: var(--ink); margin: 4px 0 2px; }
  .prod-pct small { font-size: 22px; color: var(--mint-ink); margin-left: 2px; }
  .prod-line { font-family: var(--font-data); font-size: 13px; color: var(--ink-soft); }
  .prod-line b { color: var(--ink); }
  .prod-msg { margin-top: 6px; font-size: 13px; font-weight: 600; color: var(--mint-ink); min-height: 18px; }
  .prod-fields { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 14px; }
  .prod-fields .prod-field { margin-top: 0; flex: 1 1 200px; }
  .prod-field { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; max-width: 320px; }
  .prod-field label { font-size: 12px; font-weight: 600; color: var(--ink-soft); }
  .prod-input-wrap { display: flex; align-items: center; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; padding: 0 12px; }
  .prod-input-wrap:focus-within { border-color: var(--sky); box-shadow: 0 0 0 3px rgba(153,214,234,.4); }
  .prod-input-wrap input { border: none; outline: none; flex: 1; min-width: 0; padding: 10px 0; font-family: var(--font-data); font-size: 16px; font-weight: 600; color: var(--ink); background: transparent; }
  .prod-input-wrap span { font-family: var(--font-data); font-size: 13px; color: var(--muted); }
  .prod-updated { font-size: 11.5px; color: var(--muted); }
  .wave-a { animation: waveMove 5s linear infinite; }
  .wave-b { animation: waveMove 8s linear infinite reverse; }
  @keyframes waveMove { to { transform: translateX(-60px); } }
  .liquid { transition: transform 1s cubic-bezier(.4,.1,.2,1); }
  @media (prefers-reduced-motion: reduce) { .wave-a, .wave-b { animation: none; } .liquid { transition: none; } }
  @media (max-width: 600px) { .prod-card { flex-direction: column; text-align: center; } .prod-field { margin-left: auto; margin-right: auto; } }
  .ntk-card { border-radius: var(--radius-lg); overflow: hidden; background: var(--canvas); border: 1px solid var(--line-soft); border-left: 4px solid var(--slate); box-shadow: var(--shadow-card); margin-top: 4px; }
  .ntk-card .card-head .tabicon { background: var(--slate); }
  .ntk-card.exec { border-left-color: var(--xpa); }
  .ntk-card.exec .card-head .tabicon { background: var(--xpa); }
  .ntk-card.exec .ntk-sum { background: #EDFAF6; border-color: rgba(71,215,172,.45); }
  .ntk-sum { background: #F4F6F7; border: 1px solid rgba(108,122,137,.3); border-radius: var(--radius-md); padding: 10px 12px; font-size: 13px; line-height: 1.5; color: var(--ink); }
  .ntk-sum.pending { color: var(--muted); font-style: italic; }
  .ai-tag { display: inline-block; background: var(--mint); color: var(--ink); font-size: 9.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; border-radius: 5px; padding: 1px 6px; margin-right: 8px; font-style: normal; }
  .ai-tag.edited { background: var(--apricot); }
  .ntk-stale { margin-top: 6px; font-size: 11.5px; color: #9a5b12; }
  .ntk-err { margin-top: 6px; font-size: 11.5px; color: #a32a2a; }
  .wk-btn { margin-left: auto; border: 1.5px solid var(--line); background: #fff; border-radius: 999px; font-family: var(--font-body); font-size: 11.5px; font-weight: 600; padding: 4px 10px; cursor: pointer; color: var(--ink); }
  .wk-btn:hover:not(:disabled) { background: rgba(0,0,0,.04); }
  .wk-btn:disabled { opacity: .5; cursor: default; }
  .wk-link { border: none; background: none; padding: 0; margin: 8px 0 0; display: block; font-family: var(--font-body); font-size: 11.5px; font-weight: 600; color: var(--mint-ink); cursor: pointer; text-decoration: underline; }
  .wk-edit { width: 100%; border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 10px; font-family: var(--font-body); font-size: 13px; line-height: 1.5; resize: vertical; background: #fff; }
  .wk-edit:focus { outline: none; border-color: var(--mint); }
  .wk-edit-row { display: flex; gap: 8px; margin-top: 8px; }
  .ntk-body { padding: 4px 16px 14px; display: flex; flex-direction: column; gap: 8px; }
  .ntk-line { font-size: 12.5px; line-height: 1.4; color: var(--ink-soft); }
  .ntk-section { display: inline-block; background: var(--slate); color: #fff; font-size: 10px; font-weight: 700; border-radius: 5px; padding: 1px 6px; margin-right: 6px; vertical-align: middle; font-family: var(--font-body); }
  .ntk-label { font-weight: 700; color: var(--ink); }
  .ntk-value { color: var(--ink); }
  .wins-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 24px; padding: 4px 16px 16px; }
  .win-line { display: flex; gap: 8px; align-items: flex-start; padding: 4px 0; font-size: 12.5px; }
  .win-line .star { color: #b8860b; font-size: 13px; margin-top: 1px; }

  .toolbar { display: flex; align-items: center; gap: 10px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line-soft); flex-wrap: wrap; }
  .btn {
    appearance: none; border: none; cursor: pointer; border-radius: 999px; padding: 10px 18px;
    font-family: var(--font-body); font-weight: 600; font-size: 13.5px; display: inline-flex; align-items: center; gap: 8px;
    transition: transform .12s ease, background .12s ease, border-color .12s ease;
  }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--ink); color: #fff; }
  .btn.primary:hover { background: #26282d; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
  .btn.ghost:hover { background: rgba(0,0,0,.04); }
  .btn:disabled { opacity: .55; cursor: default; }
  .status { font-size: 12px; color: var(--ink-soft); margin-left: auto; font-weight: 600; }
  .synced-note { font-size: 11px; color: var(--muted); margin-top: 8px; text-align: center; }

  .banner { border-radius: var(--radius-md); padding: 12px 16px; font-size: 13px; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; border: 1px solid; }
  .banner.warn { background: #fffaea; color: #8a6a00; border-color: rgba(255,214,55,.55); }
  .banner.error { background: var(--red-10); color: #a8362a; border-color: rgba(229,102,89,.35); }
  .banner button { margin-left: auto; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--ink-soft); }
  .empty-state .big { font-size: 40px; margin-bottom: 10px; }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(15,16,18,.55); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  .modal { background: var(--canvas); border-radius: var(--radius-lg); max-width: 640px; width: 100%; max-height: 84vh; overflow-y: auto; padding: 22px 26px; box-shadow: var(--shadow-pop); }
  .modal h2 { margin: 0 0 4px; font-size: 19px; font-family: var(--font-display); }
  .modal .sub { color: var(--ink-soft); font-size: 13px; margin-bottom: 14px; line-height: 1.5; }
  .close-x { float: right; border: none; background: transparent; color: var(--ink-soft); border-radius: 8px; width: 32px; height: 32px; cursor: pointer; font-size: 20px; line-height: 1; }
  .close-x:hover { background: rgba(0,0,0,.05); }

  #toastMsg {
    font-family: var(--font-body); position: fixed; left: 50%; bottom: 26px;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 999px;
    font-size: 13.5px; font-weight: 600; box-shadow: var(--shadow-pop);
    opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease;
    z-index: 100; display: flex; align-items: center; gap: 8px; white-space: nowrap;
  }
  #toastMsg.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toastMsg::before { content: "✓"; color: var(--mint); font-weight: 800; }

  @media (max-width: 1000px) {
    .kpi-grid { grid-template-columns: repeat(3, 1fr); }
    .owner-grid.g3, .owner-grid.g4 { grid-template-columns: repeat(2, 1fr); }
  }
  .btn, .lti-pill { white-space: nowrap; }
  @media (max-width: 1180px) { .topbar { flex-wrap: wrap; } .topbar-nav { flex-basis: 100%; } }
  @media (max-width: 600px) {
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .owner-grid.g3, .owner-grid.g4 { grid-template-columns: 1fr; }
    .wins-cols { grid-template-columns: 1fr; }
    .topbar { grid-template-columns: 1fr; text-align: center; }
    .topbar { flex-direction: column; }
    .topbar-right { justify-self: center; flex-wrap: wrap; justify-content: center; }
    .brand { justify-self: center; }
    .date-pill { justify-self: center; }
  }
</style>

<script>
(function () {
  const FONT = "Poppins, 'Segoe UI', Arial, sans-serif";

  // ---------------- Layout definitions (mirrors the sheet's "New Master" template) ----------------
  const KPI_SECTIONS = [
    { key: 'safety', icon: '🦺', title: 'SAFETY', color: 'var(--safety)',
      metrics: [['ltifr','LTIFR #'], ['nearmiss','Near Miss'], ['safetyconv','Safety Conversation'], ['housekeeping','House Keeping Score']] },
    { key: 'qc', icon: '🧪', title: 'QC - MONTHLY KPI', color: 'var(--qc)',
      metrics: [['micro','Micro %'], ['gmp','GMP %'], ['physchem','PhysChem %'], ['sensory','Sensory']] },
    { key: 'brew', icon: '🍺', title: 'BREW & CELLAR', color: 'var(--brew)',
      metrics: [['krones','Brewhouse Krones'], ['dme','Brewhouse DME'], ['ferm','Fermentation'], ['bbt','BBT']] },
    { key: 'packaging', icon: '🥫', title: 'PACKAGING', color: 'var(--packaging)',
      metrics: [['cartons','Cartons'], ['kegs','Kegs'], ['changeovers','Change Overs'], ['me','Last week ME']] },
    { key: 'maintenance', icon: '🔧', title: 'MAINTENANCE', color: 'var(--maintenance)',
      metrics: [['openwo','Open WO'], ['wpwo','WIP WO'], ['breakdowns','Weekly Breakdowns'], ['completed','Weekly Completed WO']] },
    { key: 'logistics_cs', icon: '🚚', title: 'LOGISTICS & C-SERVICE', color: 'var(--logistics)',
      metrics: [['soldlts','Sold Lts'], ['complaints','Customer Complaints'], ['keg','Keg'], ['carton','Carton']] },
  ];

  const OWNER_GROUPS = [
    { cols: 3, sections: [
      { key: 'safety_o', icon: '🦺', title: 'Safety', defaultOwner: 'Manny', color: 'var(--safety)', bullets: [
        "Any incidents or near-misses from the previous day",
        "Focused safety reminders or safety share",
        "Time since last Lost Time Incident (LTI) on site",
        "General information" ] },
      { key: 'qc_o', icon: '🧪', title: 'QC', defaultOwner: 'Patrick', color: 'var(--qc)', bullets: [
        "Current Blocked Stock",
        "Status of any hold or flagged products BA",
        "Status of any release BA",
        "Issues from the previous day's testing or inspections",
        "Staffing issues",
        "General information" ] },
      { key: 'brew_o', icon: '🍺', title: 'Brew & Cellar', defaultOwner: 'Flash', color: 'var(--brew)', bullets: [
        "Brewing schedule and key priorities (e.g., start times for batches, transfers)",
        "Physchem KPI's (Out of spec Brewhouse Gravitys and pH for last 24hrs)",
        "Equipment maintenance or downtime impacting brewing (Slow Tx speeds, Brewhouse delays)",
        "Tank space or fermentation challenges",
        "CIP in spec and available to transfer into",
        "Staffing issues",
        "General information / Temporary checking yeast collection Odor YES or NO" ] },
    ]},
    { cols: 4, sections: [
      { key: 'packaging_o', icon: '🥫', title: 'Packaging', defaultOwner: 'Razor', color: 'var(--packaging)', bullets: [
        "Overview of packaging runs: canning",
        "Overview of packaging runs: kegs",
        "Changeovers planned for the day",
        "Equipment issues or maintenance planned",
        "Staffing issues",
        "General information" ] },
      { key: 'engineering_o', icon: '📐', title: 'Engineering', defaultOwner: 'Mark', color: 'var(--engineering)', bullets: [
        "Project and contractor update",

  // ---------------- CSV / sheet fetching ----------------
  function parseCSV(text) {
    const rows = [];
    let row = [], field = '', inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false; }
        else field += c;
      } else {
        if (c === '"') inQuotes = true;
        else if (c === ',') { row.push(field); field = ''; }
        else if (c === '\r') { /* skip */ }
        else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
        else field += c;
      }
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  function tabNameCandidates(date) {
    const d = String(date.getDate()).padStart(2, '0');
    const dNoPad = String(date.getDate());
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const mNoPad = String(date.getMonth() + 1);
    const yy = String(date.getFullYear()).slice(-2);
    const yyyy = String(date.getFullYear());
    return [...new Set([
      `${d}/${m}/${yy}`, `${d}/${m}`, `${d}/${m}/${yyyy}`, `${dNoPad}/${mNoPad}/${yy}`, `${dNoPad}/${mNoPad}`,
    ])];
  }

  async function fetchTabCSV(tabName) {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tabName)}`;
    const res = await fetch(url);
    if (!res.ok) return null;
    const text = await res.text();
    if (!text || text.length < 20 || /^<(!doctype|html)/i.test(text.trim())) return null;
    if (!/safety/i.test(text.slice(0, 400))) return null;
    return parseCSV(text);
  }

  function fetchTabJSONP(tabName) {
    return new Promise((resolve, reject) => {
      const cbName = '__gsheet_cb_' + Math.random().toString(36).slice(2);
      const script = document.createElement('script');
      let settled = false;
      const cleanup = () => { delete window[cbName]; script.remove(); };
      window[cbName] = data => {
        if (settled) return;
        settled = true;
        try {
          const table = data && data.table;
          if (!table || !table.rows) { resolve(null); return; }
          const rows = table.rows.map(r => (r.c || []).map(cell => {
            if (!cell) return '';
            if (cell.f !== undefined && cell.f !== null) return String(cell.f);
            if (cell.v !== undefined && cell.v !== null) return String(cell.v);
            return '';
          }));
          // Google's JSON output can strip N header rows into table.cols instead of leaving them in table.rows
          // (parsedNumHeaders), which silently shifts every row number up relative to the CSV export. Put
          // reconstructed header row(s) back so row numbering matches the sheet again.
          const headerCount = table.parsedNumHeaders || 0;
          for (let i = 0; i < headerCount; i++) {
            rows.unshift((table.cols || []).map(c => (c && c.label) || ''));
          }
          resolve(rows);
        } catch (e) { resolve(null); }
        cleanup();
      };
      script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(tabName)}&tqx=out:json;responseHandler:${cbName}`;
      script.onerror = () => { if (!settled) { settled = true; reject(new Error('JSONP load failed')); cleanup(); } };
      document.body.appendChild(script);
      setTimeout(() => { if (!settled) { settled = true; reject(new Error('JSONP timeout')); cleanup(); } }, 8000);
    });
  }

  async function fetchTabRows(tabName) {
    try { const v = await fetchTabCSV(tabName); if (v) return v; } catch (e) { /* fall through */ }
    try { const v = await fetchTabJSONP(tabName); if (v && v.length) return v; } catch (e) { /* both failed */ }
    return null;
  }

  function ragClass(raw) {
    const t = (raw || '').toLowerCase();
    if (/on\s*track/.test(t)) return 'green';
    if (/at\s*risk/.test(t)) return 'amber';
    if (/off\s*track|behind|delayed|not\s*on\s*track/.test(t)) return 'red';
    if (/red|🔴/.test(t)) return 'red';
    if (/amber|orange|yellow|🟡|🟠/.test(t)) return 'amber';
    if (/green|🟢/.test(t)) return 'green';
    return '';
  }

  function normLabel(s) {
    return (s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  }
  function labelsMatch(cellText, knownLabel) {
    const a = normLabel(cellText), b = normLabel(knownLabel);
    if (!a || !b) return false;
    const anchor = b.slice(0, Math.min(14, b.length)); // first ~14 normalized chars is plenty distinctive per label
    return a.includes(anchor);
  }

  // Builds a fresh, self-contained display object straight from parsed sheet rows — no merging with prior state.
  // Rows are located by matching each field's known label text rather than trusting fixed row numbers, since the

  function buildDisplayState(rows, tabName) {
    const cell = (r, c) => (rows[r - 1] && rows[r - 1][c] !== undefined ? String(rows[r - 1][c]).trim() : '');
    const findRow = (labelCol, label, fromRow, toRow) => {
      for (let r = fromRow; r <= toRow; r++) {
        if (labelsMatch(cell(r, labelCol), label)) return r;
      }
      return null;
    };

    // ---- KPI: each metric's row is wherever its label actually is, searched within its section's label column ----
    const kpi = {};
    KPI_SECTIONS.forEach((sec, i) => {
      const labelCol = i * 2, valueCol = labelCol + 1;
      let searchFrom = 2;
      kpi[sec.key] = sec.metrics.map(([key, label]) => {
        const row = findRow(labelCol, label, searchFrom, searchFrom + 8) || searchFrom;
        searchFrom = row + 1;
        return { key, label, value: cell(row, valueCol) };
      });
    });

    // ---- Owner blocks: find each section's header row (RAG Status column header), then bullets in sequence ----
    const OWNER_COL = 0, LABEL_COL = 1, RAG_COL = 6, COMMENT_COL = 7, LAST_COL = 11;
    const readComment = row => {
      const parts = [];
      for (let c = COMMENT_COL; c <= LAST_COL; c++) {
        const v = cell(row, c);
        if (v) parts.push(v);
      }
      return parts.join(' ');
    };
    const isChecked = raw => /^(true|1|yes|✓|checked)$/i.test((raw || '').trim());
    const owner = {};
    const needToKnow = [];
    let cursor = 6; // KPI grid ends around here; first owner header should appear shortly after
    let safetyLtiValue = '';
    OWNER_GROUPS.flatMap(g => g.sections).forEach(sec => {
      let headerRow = null;
      for (let r = cursor; r <= cursor + 12; r++) {
        if (normLabel(cell(r, RAG_COL)).includes('rag')) { headerRow = r; break; }
      }
      // Need to Know is a checkbox column added after Comments — locate it from this section's own
      // header row so it's found regardless of exactly which column it landed in.
      let ntkCol = 12;
      if (headerRow) {
        for (let c = LAST_COL + 1; c <= LAST_COL + 6; c++) {
          if (normLabel(cell(headerRow, c)).includes('need to know')) { ntkCol = c; break; }
        }
      }
      let rowCursor = (headerRow || cursor) + 1;
      const ownerName = cell(rowCursor, OWNER_COL) || sec.defaultOwner;
      const bullets = sec.bullets.map(label => {
        // A blank label means a freeform row with no fixed prompt (e.g. People's extra entries) —
        // there's no text to search for, so just take the next row in sequence.
        const row = label ? (findRow(LABEL_COL, label, rowCursor, rowCursor + 10) || rowCursor) : rowCursor;
        rowCursor = row + 1;
        const value = readComment(row);
        if (sec.key === 'safety_o' && /lti/i.test(label)) safetyLtiValue = value;
        if (value && isChecked(cell(row, ntkCol))) {
          needToKnow.push({ section: sec.title, label: label || sec.title, value });
        }
        return { label, value, rag: ragClass(cell(row, RAG_COL)) };
      });
      owner[sec.key] = { ownerName, bullets };
      cursor = rowCursor;
    });

    let ltiDays = null;
    const ltiMatch = safetyLtiValue.match(/(\d+)\s*Days?\s*LTI\s*Free/i);
    if (ltiMatch) ltiDays = parseInt(ltiMatch[1], 10);

    // ---- Wins: find the "Wins" header, then read the following rows as free-text entries ----
    let winsHeaderRow = null;
    for (let r = cursor; r <= cursor + 10; r++) {
      if (normLabel(cell(r, 0)).includes('wins') || normLabel(cell(r, 1)).includes('wins')) { winsHeaderRow = r; break; }
    }
    const winsStart = (winsHeaderRow || cursor) + 1;
    const winCell = r => cell(r, 1) || cell(r, 0); // win text lives in column B, like every other free-text row
    const winsLeft = [], winsRight = [];
    for (let i = 0; i < WINS_COUNT / 2; i++) winsLeft.push(winCell(winsStart + i));
    for (let i = 0; i < WINS_COUNT / 2; i++) winsRight.push(winCell(winsStart + WINS_COUNT / 2 + i));

    return { tabName, kpi, owner, ltiDays, winsLeft, winsRight, needToKnow, syncedAt: new Date().toISOString() };
  }

  // ---------------- App state & rendering ----------------

  let dSummary = null, dLoadedFor = null, dBusy = false, dError = '', dEditing = false, dDraft = '';

  const dKey = () => 'daily_ai_v1_' + current.tabName;

  // ---------------- Sync orchestration ----------------
  async function cacheLastGood(display) {
    try { await window.storage.set(CACHE_KEY, JSON.stringify(display), true); } catch (e) { /* best effort only */ }
  }
  async function loadCachedLast() {
    try {
      const r = await window.storage.get(CACHE_KEY, true);
      return r && r.value ? JSON.parse(r.value) : null;
    } catch (e) { return null; }
  }

  async function syncFromSheet(silent) {
    if (syncing) return;
    syncing = true;
    if (!silent) { render(); flashStatus('Syncing from sheet…'); }
    const candidates = tabNameCandidates(activeDate);
    let found = null;
    for (const name of candidates) {
      const rows = await fetchTabRows(name);
      if (rows) { found = { name, rows }; break; }
    }
    syncing = false;
    if (found) {
      current = buildDisplayState(found.rows, found.name);
      lastError = null;
      if (isViewingToday()) cacheLastGood(current); // only today's data should back the offline fallback cache
      render();
      flashStatus(`Synced from "${found.name}"`);
      return true;
    }
    lastError = { triedNames: candidates };
    render();
    if (!silent) flashStatus('Could not find a matching tab');
    return false;
  }

  async function manualSyncTab(name, statusEl) {
    statusEl.textContent = `Trying "${name}"…`;
    const rows = await fetchTabRows(name);
    if (!rows) { statusEl.textContent = `Couldn't read a tab named "${name}". Double check the exact spelling in the sheet.`; return; }
    current = buildDisplayState(rows, name);
    lastError = null;
    if (isViewingToday()) cacheLastGood(current);
    render();
    flashStatus(`Synced from "${name}"`);
    const backdrop = statusEl.closest('.modal-backdrop');
    if (backdrop) backdrop.remove();
  }

  const wxCache = {}; // ymd -> {status:'loading'|'ok'|'err', ...}
  const dateKey = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  function weatherFor(d) {
    const key = dateKey(d);
    const c = wxCache[key];
    if (c) return c.status === 'ok' ? c : null;
    wxCache[key] = { status: 'loading' };
    fetch('https://api.open-meteo.com/v1/forecast?latitude=' + WX_LAT + '&longitude=' + WX_LON +
      '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum&timezone=Australia%2FBrisbane&start_date=' + key + '&end_date=' + key)
      .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
      .then(j => {
        const dd = j.daily; if (!dd || !dd.time || !dd.time.length) throw new Error('no data');
        const code = dd.weather_code[0], m = WX_CODES[code] || ['🌡️', 'Weather'];

  // ---------------- Annual production target (shared with Weekly Ops, saved in this browser) ----------------

  // Gmail strips SVG, so the gauge is drawn to a PNG for the email.
  function fermenterPng() {
    return new Promise(resolve => {
      try {
        const svg = fermenterSvg(prod.litres / prod.target).replace('role="img"', 'role="img" style="background:#fff"');
        const img = new Image();
        img.onload = () => {
          try {

      <div class="prod-tank">${fermenterSvg()}</div>
      <div class="prod-info">
        <div class="prod-kicker">Annual production target</div>
        <div class="prod-pct"><span id="prodPct">0</span><small>%</small></div>
        <div class="prod-line"><b id="prodDone">0</b> of <b id="prodTarget"></b> litres packaged</div>
        <div class="prod-line">Remaining: <b id="prodLeft"></b> L</div>
        <div class="prod-msg" id="prodMsg"></div>
        <div class="prod-fields">
        <div class="prod-field">
          <label for="prodTargetInput">Annual target (litres)</label>
          <div class="prod-input-wrap"><input id="prodTargetInput" type="text" inputmode="numeric" autocomplete="off"><span>L</span></div>
        </div>
        <div class="prod-field">
          <label for="prodInput">Packaged total so far (litres)</label>

        </div>

        <div class="prod-updated" id="prodUpdated" style="margin-top:8px;"></div>
      </div>`;
    const input = card.querySelector('#prodInput');
    const g = card.querySelector('#liquidGroup');
    const upd = () => {
      const pct = Math.min(1, Math.max(0, prod.litres / prod.target));
      g.style.transform = `translateY(${(1 - pct) * TANK_H}px)`;
      const shown = prod.litres / prod.target * 100;
      card.querySelector('#prodPct').textContent = shown >= 100 ? '100' : shown.toFixed(1);
      card.querySelector('#prodDone').textContent = fmtL(prod.litres);
      card.querySelector('#prodTarget').textContent = fmtL(prod.target);
      card.querySelector('#prodLeft').textContent = fmtL(Math.max(0, prod.target - prod.litres));
      card.querySelector('#prodMsg').textContent = prod.litres >= prod.target ? '🎉 Target reached' + (prod.litres > prod.target ? ` — ${fmtL(prod.litres - prod.target)} L over` : '') : '';
      card.querySelector('#prodUpdated').textContent = prod.updated ? 'Last updated ' + new Date(prod.updated).toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' }) : 'Saved in this browser when you leave the field.';
    };
    const tInput = card.querySelector('#prodTargetInput');
    tInput.value = fmtL(prod.target);
    tInput.addEventListener('input', () => { const n = parseLitres(tInput.value); if (n > 0) { prod.target = n; prod.targetSet = true; upd(); } });
    tInput.addEventListener('change', () => {
      const n = parseLitres(tInput.value);

    input.value = prod.litres ? fmtL(prod.litres) : '';
    input.addEventListener('input', () => { prod.litres = parseLitres(input.value); upd(); });
    input.addEventListener('change', () => {
      prod.litres = parseLitres(input.value); prod.updated = new Date().toISOString();
      saveProd();
      input.value = prod.litres ? fmtL(prod.litres) : ''; upd();
    });
    input.addEventListener('keydown', e => { if (e.key === 'Enter') input.blur(); });
    upd();
    // start empty, then fill up to the current level
    const level = g.style.transform;
    g.style.transform = `translateY(${TANK_H}px)`;
    requestAnimationFrame(() => requestAnimationFrame(() => { g.style.transform = level; }));
    return card;
  }

  function buildEmailPlainText() {
    const lines = [current.tabName, ''];
    if (dSummary && dSummary.text) { lines.push('EXECUTIVE SUMMARY'); lines.push('  ' + dSummary.text); lines.push(''); }
    if (current.needToKnow && current.needToKnow.length) {
      lines.push('KEY POINTS');
      current.needToKnow.forEach(item => lines.push(`  - [${item.section}] ${item.value}`));
      lines.push('');
    }
    lines.push('WINS');
    [...current.winsLeft, ...current.winsRight].filter(Boolean).forEach(w => lines.push(`  - ${w}`));
    lines.push('');
    OWNER_GROUPS.flatMap(g => g.sections).forEach(sec => {
      const o = current.owner[sec.key];
      const filled = o.bullets.filter(b => b.value);
      if (!filled.length) return; // nothing posted in this tile — leave it out entirely
      lines.push(`${sec.title} — Owner: ${o.ownerName}`);
      filled.forEach(b => lines.push(b.label ? `  - ${b.label}: ${b.value}` : `  - ${b.value}`));
      lines.push('');
    });
    lines.push('KPI SNAPSHOT');
    KPI_SECTIONS.forEach(sec => { lines.push(sec.title); current.kpi[sec.key].forEach(m => lines.push(`  ${m.label}: ${m.value}`)); lines.push(''); });
    return lines.join('\n');
  }
  let toastTimer;
  function showToast(msg) {
    let toast = document.getElementById('toastMsg');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'toastMsg';
      document.body.appendChild(toast);
    }
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.classList.remove('show'); }, 2600);
  }

  function showEmailCopyFallback(html) {
    const backdrop = el('div', 'modal-backdrop');
    const modal = el('div', 'modal');
    const closeBtn = el('button', 'close-x', '✕');
    closeBtn.addEventListener('click', () => backdrop.remove());
    modal.appendChild(closeBtn);
    modal.appendChild(el('h2', '', "Couldn't copy automatically"));
    modal.appendChild(el('div', 'sub', "Your browser blocked the automatic copy. Click inside the box below, select all (Ctrl/Cmd+A), and copy (Ctrl/Cmd+C) — then paste into your email."));
    const preview = document.createElement('div');
    preview.contentEditable = 'true';
    preview.style.cssText = 'border:1px solid #E5E7EB;border-radius:10px;padding:14px;max-height:50vh;overflow:auto;';
    preview.innerHTML = html;
    modal.appendChild(preview);
    backdrop.appendChild(modal);
    backdrop.addEventListener('click', e => { if (e.target === backdrop) backdrop.remove(); });
    document.body.appendChild(backdrop);
  }

  async function exportToGmail() {
    if (!current) { showToast('Nothing synced yet'); return false; }
    for (let i = 0; i < 20 && (wxCache[dateKey(activeDate)] || {}).status === 'loading'; i++) await new Promise(r => setTimeout(r, 150));
    refreshProd();
    gaugePng = prod.litres > 0 ? await fermenterPng() : null;
    const html = buildEmailHtml();
    const text = buildEmailPlainText();
    try {
      if (navigator.clipboard && window.ClipboardItem) {
        const item = new ClipboardItem({ 'text/html': new Blob([html], { type: 'text/html' }), 'text/plain': new Blob([text], { type: 'text/plain' }) });
        await navigator.clipboard.write([item]);
        showToast('Email copied — ready to paste');
        return true;
      }
    } catch (err) { console.error('Clipboard write failed', err); }
    showEmailCopyFallback(html);
    return false;
  }

  // ---------------- Boot ----------------
  function waitForStorage(timeoutMs) {
    return new Promise(resolve => {
      const start = Date.now();
      (function check() {
        if (window.storage) return resolve(true);
        if (Date.now() - start > (timeoutMs || 3000)) return resolve(false);
        setTimeout(check, 30);
      })();
    });
  }

  async function boot() {
    await waitForStorage();
    current = await loadCachedLast(); // show last-known-good immediately if we have one
    render();
    await syncFromSheet(true); // then try a live sync straight away
    checkAutoSync();
    setInterval(checkAutoSync, 60000);
  }
  boot();
})();
